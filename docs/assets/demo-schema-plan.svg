<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#eef2f6"/>
  <rect x="70" y="46" width="1140" height="664" rx="10" fill="#ffffff" stroke="#d9e1ea"/>
  <text x="100" y="94" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#263238">DataSheet Agent - Schema Planner</text>
  <text x="100" y="132" font-family="Arial, sans-serif" font-size="18" fill="#607d8b">用户需求: 5 条电商订单，金额 10-500 元，支付状态限定为已支付 / 未支付 / 退款。</text>
  <rect x="100" y="166" width="270" height="42" rx="6" fill="#f4f8fb" stroke="#cfd8dc"/>
  <text x="120" y="193" font-family="Arial, sans-serif" font-size="16" fill="#37474f">模板: 电商订单测试数据</text>
  <rect x="390" y="166" width="150" height="42" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="418" y="193" font-family="Arial, sans-serif" font-size="16" fill="#1565c0">规划 Schema</text>
  <rect x="100" y="240" width="1080" height="58" rx="6" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="122" y="276" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263238">电商订单测试数据</text>
  <text x="325" y="276" font-family="Arial, sans-serif" font-size="16" fill="#607d8b">目标行数: 5</text>
  <text x="465" y="276" font-family="Arial, sans-serif" font-size="16" fill="#607d8b">来源: 业务模板 + 自然语言约束</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="100" y="328" width="1080" height="46" fill="#455a64"/>
    <text x="124" y="357" fill="#ffffff" font-weight="700">字段</text>
    <text x="270" y="357" fill="#ffffff" font-weight="700">字段名</text>
    <text x="455" y="357" fill="#ffffff" font-weight="700">类型</text>
    <text x="585" y="357" fill="#ffffff" font-weight="700">约束</text>
    <rect x="100" y="374" width="1080" height="48" fill="#ffffff" stroke="#eceff1"/>
    <text x="124" y="404" fill="#263238">订单号</text>
    <text x="270" y="404" fill="#263238">order_id</text>
    <text x="455" y="404" fill="#263238">string</text>
    <text x="585" y="404" fill="#263238">唯一，ORD + 日期 + 4位序号</text>
    <rect x="100" y="422" width="1080" height="48" fill="#f8fafc" stroke="#eceff1"/>
    <text x="124" y="452" fill="#263238">商品类别</text>
    <text x="270" y="452" fill="#263238">product_category</text>
    <text x="455" y="452" fill="#263238">enum</text>
    <text x="585" y="452" fill="#263238">数码 / 家居 / 服饰 / 食品 / 美妆</text>
    <rect x="100" y="470" width="1080" height="48" fill="#ffffff" stroke="#eceff1"/>
    <text x="124" y="500" fill="#263238">金额</text>
    <text x="270" y="500" fill="#263238">amount</text>
    <text x="455" y="500" fill="#263238">number</text>
    <text x="585" y="500" fill="#263238">范围: 10 ~ 500，单位 CNY</text>
    <rect x="100" y="518" width="1080" height="48" fill="#f8fafc" stroke="#eceff1"/>
    <text x="124" y="548" fill="#263238">支付状态</text>
    <text x="270" y="548" fill="#263238">payment_status</text>
    <text x="455" y="548" fill="#263238">enum</text>
    <text x="585" y="548" fill="#263238">已支付 / 未支付 / 退款</text>
    <rect x="100" y="566" width="1080" height="48" fill="#ffffff" stroke="#eceff1"/>
    <text x="124" y="596" fill="#263238">下单时间</text>
    <text x="270" y="596" fill="#263238">order_time</text>
    <text x="455" y="596" fill="#263238">datetime</text>
    <text x="585" y="596" fill="#263238">YYYY-MM-DD HH:mm:ss</text>
  </g>
  <rect x="100" y="638" width="1080" height="44" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="122" y="666" font-family="Arial, sans-serif" font-size="16" fill="#2e7d32">Schema Planner 已将自然语言需求转为可执行字段约束。</text>
</svg>
